name: Rating replay

# Full rating recalculation (docs/architecture.md section 3, apps/api/scripts/replay.ts).
# Runs daily and does nothing unless a replay was requested (out-of-order battle, admin request,
# later: annulments, merged formats, late initial estimates). "Run workflow" can force it.

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Recalculate even without an open request
        type: boolean
        default: false

permissions:
  contents: read

# Never together with a deployment (migrations) or another replay.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Insert the database id
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" apps/api/wrangler.jsonc

      - name: Replay
        working-directory: apps/api
        run: pnpm replay ${{ inputs.force && '--force' || '' }}
