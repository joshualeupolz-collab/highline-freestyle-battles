name: Deploy

# Publishes the app to Cloudflare on every push to main (and on demand via "Run workflow").
# One-time setup: docs/deployment.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check configuration
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing secret:CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing variable:CLOUDFLARE_ACCOUNT_ID"
          [ -n "$D1_DATABASE_ID" ] || missing="$missing variable:D1_DATABASE_ID"
          [ -n "$PASSWORD_PEPPER" ] || missing="$missing secret:PASSWORD_PEPPER"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub settings:$missing (see docs/deployment.md)"
            exit 1
          fi

      # Never deploy something that fails its own checks.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Insert the database id
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: sed -i "s/00000000-0000-0000-0000-000000000000/$D1_DATABASE_ID/" apps/api/wrangler.jsonc

      # Videos (docs/deployment.md, "Videos"). Creating the bucket needs R2 permission on the
      # API token; the CORS rules let phones upload directly to R2 from the app's address.
      - name: Video bucket and its CORS rules
        working-directory: apps/api
        run: |
          pnpm exec wrangler r2 bucket info hfb-videos > /dev/null 2>&1 \
            || pnpm exec wrangler r2 bucket create hfb-videos --location weur
          pnpm exec wrangler r2 bucket cors set hfb-videos --file r2-cors.json --force

      - name: Apply database migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply DB --remote

      - name: Deploy the Worker with its secrets
        working-directory: apps/api
        env:
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::warning::No VAPID keys: push notifications are off. See docs/deployment.md, Push notifications."
          fi
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::warning::No R2 access key: videos are uploaded through the Worker (max 95 MB each). See docs/deployment.md, Videos."
          fi
          # Secrets go into a temporary file outside the repository and are never printed.
          node -e '
            const e = process.env;
            const s = { PASSWORD_PEPPER: e.PASSWORD_PEPPER };
            if (e.SETUP_TOKEN) s.SETUP_TOKEN = e.SETUP_TOKEN;
            if (e.R2_ACCESS_KEY_ID && e.R2_SECRET_ACCESS_KEY) {
              s.R2_ACCESS_KEY_ID = e.R2_ACCESS_KEY_ID;
              s.R2_SECRET_ACCESS_KEY = e.R2_SECRET_ACCESS_KEY;
              s.R2_ACCOUNT_ID = e.CLOUDFLARE_ACCOUNT_ID;
            }
            if (e.VAPID_PUBLIC_KEY && e.VAPID_PRIVATE_KEY) {
              s.VAPID_PUBLIC_KEY = e.VAPID_PUBLIC_KEY;
              s.VAPID_PRIVATE_KEY = e.VAPID_PRIVATE_KEY;
              if (e.VAPID_SUBJECT) s.VAPID_SUBJECT = e.VAPID_SUBJECT;
            }
            require("fs").writeFileSync(e.RUNNER_TEMP + "/secrets.json", JSON.stringify(s));
          '
          pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          rm "$RUNNER_TEMP/secrets.json"
